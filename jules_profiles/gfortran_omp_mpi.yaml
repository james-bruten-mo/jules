profile:
    min_compiler_version: 12
    fortran_compile_flags_common:
        - -fall-intrinsics
        - -std=f2003
        - -fmax-identifier-length=63
        - -ffree-line-length-132
        - -fimplicit-none
        - -fbounds-check
        - -Warray-bounds
        - -Werror
        - -fopenmp


